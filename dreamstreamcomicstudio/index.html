<!DOCTYPE html>
<html lang="en" data-ds-skin="atlas">
  <head>
    <meta charset="UTF-8" />
    <!-- data-ds-skin on <html>: the Atlas design language on every host (docs/design/atlas-skin.md).
         The build switch VITE_DS_SKIN_EVERYWHERE=off strips only this attribute (the Atlas token block)
         from every HTML entry (vite.config.ts dsSkinEverywhere); the comics host then still boots it
         (services/dsSkin.ts). It does not undo the theme: dark on every page from first paint (this
         theme-boot.js plus initTheme() in index.tsx) and the bridge D4 token moves stay; reverting
         those is a code revert of this script tag and of that call. theme-boot.js puts the saved theme
         (`.dark`) on <html> before first paint; it is external on purpose: the CSP allows 'self'
         scripts and hashes the page's single inline script, which stays as it is. -->
    <script src="/theme-boot.js"></script>
    <!-- interactive-widget=resizes-content: Android Chrome (108+) defaults to only
         resizing the VISUAL viewport when the keyboard opens, which left the chat
         composer hidden under the keyboard. This makes the layout viewport resize, so
         100dvh flex layouts shrink above the keyboard. iOS ignores it (harmless). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Keep the viewport zoomable: never add maximum-scale or user-scalable=no
         (WCAG 1.4.4; a11y.spec.ts asserts it). -->
    <meta name="description" content="Make comics with an AI director, then read and share them anywhere. DreamStream Studio also does AI chat and code." />
    <!-- Browser/OS chrome colour follows the calm-studio paper (light) and ink (dark)
         canvases; the landing page sets its brand blue at runtime. -->
    <meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/app.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>DreamStream Studio — Comics, AI Chat &amp; Code</title>
    <!-- Warm up connections to the external origins we pull from, so a slow handshake
         doesn't widen the window before styles/fonts arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- PDF Generation Libraries (export-only; deferred so a slow/blocked CDN can't
         stall first paint — they're not needed until the user exports a PDF).
         Pinned by Subresource Integrity (the SHA-512 cdnjs publishes for these exact
         files): if the CDN ever served different bytes, the browser refuses to run them.
         tests/edge/supplyChain.test.ts keeps every external script pinned. -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  /* The page under everything (bridge D5: Atlas on every host): the skin's paper, and its dark paper in dark
     (public/theme-boot.js has already put `.dark` on <html>). Each var() falls back to the skin's own value
     (index.css [data-ds-skin="atlas"] and its .dark block; tests/config/appShell.test.ts pins them), so the page
     is right before index.css arrives, and if it never does. The text stays the light ink in both themes:
     the legacy-kit pages keep their light surfaces in dark and read their text from here (atlas-skin.md D5);
     a page on tokens sets its own ink. */
  body { background-color: var(--ds-canvas, #ffffff); color: #0a0a0a; }
  html.dark body { background-color: var(--ds-canvas, #0a0a0a); }
  /* Scrollers that ask for a visible bar (.custom-scrollbar): thin and ink-tinted on a clear track, as the
     skin draws every scrollbar (index.css "Base rules under the skin"). WebKit only; the rgba line is for a
     browser without color-mix(). */
  .custom-scrollbar::-webkit-scrollbar { width: 10px; height: 10px; }
  /* Thinner scrollbars on touch/small screens so they don't eat horizontal space. */
  @media (max-width: 767px), (pointer: coarse) {
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    border: 2px solid transparent; border-radius: 9999px;
    background: padding-box rgba(128,128,128,0.35);
    background: padding-box color-mix(in srgb, var(--ds-ink, #0a0a0a) 22%, transparent);
  }
  /* First-paint splash, rendered inside #root and styled with INLINE CSS only (never
     depends on the bundled Tailwind sheet). Guarantees a styled first paint — so the app
     can never show raw/unstyled content while JS/CSS are still loading. React replaces
     #root's contents on mount, removing it automatically. Paper and ink like the page under
     it (each var() falls back to the skin's value), a quiet ink spinner, the name, and
     after 12 s (the script below) a calm Reload on the ink primary. */
  #app-splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px;
    background-color: var(--ds-canvas, #ffffff); color: var(--ds-ink, #0a0a0a);
    font-family: var(--ds-font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    -webkit-font-smoothing: antialiased;
  }
  html.dark #app-splash { background-color: var(--ds-canvas, #0a0a0a); color: var(--ds-ink, #fafafa); }
  #app-splash .spinner {
    width: 28px; height: 28px; border-radius: 9999px;
    border: 3px solid rgba(128,128,128,0.25);
    border-color: color-mix(in srgb, currentColor 14%, transparent);
    border-top-color: currentColor;
    animation: appSplashSpin 0.8s linear infinite;
  }
  #app-splash .brand { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  #app-splash .slow {
    display: none; max-width: 300px; text-align: center; font-size: 13px; line-height: 1.5;
    color: var(--ds-muted, #5c5c5c);
  }
  html.dark #app-splash .slow { color: var(--ds-muted, #a3a3a3); }
  #app-splash .slow button {
    margin-top: 12px; min-height: 36px; padding: 0 16px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 500; line-height: 1;
    color: var(--ds-on-accent, #ffffff); background: var(--ds-accent, #0a0a0a);
    border: 1px solid transparent; border-radius: var(--ds-radius-control, 0.5rem);
  }
  html.dark #app-splash .slow button { color: var(--ds-on-accent, #0a0a0a); background: var(--ds-accent, #fafafa); }
  #app-splash .slow button:focus-visible { outline: 2px solid var(--ds-focus, currentColor); outline-offset: 2px; }
  @media (pointer: coarse) { #app-splash .slow button { min-height: 44px; } }
  @keyframes appSplashSpin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #app-splash .spinner { animation: none; } }
</style>
<link rel="stylesheet" href="/index.css">
<!--ds:head-->
</head>
  <body class="antialiased">
    <div id="root">
      <!-- Styled (inline-CSS) loading splash. React clears #root on mount and this vanishes. -->
      <div id="app-splash" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <div class="brand">DreamStream Studio</div>
        <div class="slow">
          This is taking longer than usual.
          <br />
          <button type="button" id="app-splash-reload">Reload</button>
        </div>
      </div>
    </div>
    <!-- Watchdog: if the app JS hasn't mounted (splash still present) after a while —
         e.g. a chunk/CDN failed to load — surface a styled Reload prompt instead of an
         indefinite spinner. Harmless once React has replaced #root. This is the page's
         ONLY inline script and the CSP allows it by its SHA-256
         (INDEX_INLINE_SCRIPT_HASHES in functions/_middleware.ts): change one byte and
         tests/edge/securityHeaders.test.ts prints the new hash. The Reload button is wired
         here, not with an inline onclick, so the policy never needs 'unsafe-inline'. -->
    <script>
      (function () {
        var reload = document.getElementById('app-splash-reload');
        if (reload) reload.addEventListener('click', function () { window.location.reload(); });
        setTimeout(function () {
          var slow = document.querySelector('#app-splash .slow');
          if (slow) slow.style.display = 'block';
        }, 12000);
      })();
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
