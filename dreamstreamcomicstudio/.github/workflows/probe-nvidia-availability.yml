# Reference copy only: GitHub runs the repository-root .github/workflows/probe-nvidia-availability.yml
# The backend already owns provider/database credentials. GitHub authenticates with
# a short-lived OIDC token restricted to this exact production workflow; no copied secrets.
name: Probe NVIDIA Availability

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: catalog-maintenance-probe-nvidia
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/Dreamstrream-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run authorized backend maintenance
        run: node scripts/ops/catalogMaintenance.mjs probe-nvidia
