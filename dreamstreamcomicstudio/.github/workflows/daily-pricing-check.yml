name: Daily Pricing Check

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  pricing-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pricing sync check
        run: npm run pricing:sync:check

      - name: Run billing regression checks
        run: |
          npm run typecheck
          npm test -- --run
