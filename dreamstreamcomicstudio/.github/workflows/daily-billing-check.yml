name: Daily Billing Reconciliation

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  billing-reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run billing reconciliation check
        run: npm run billing:reconcile:check
