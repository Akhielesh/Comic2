<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="960" viewBox="0 0 1480 960"><rect x="0" y="0" width="1480" height="960" rx="0" fill="#eef1f4" stroke="none" stroke-width="2"  opacity="1"/><text x="40" y="52" font-size="24" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Stage 1 — Connect a key (first run)</text><text x="40" y="80" font-size="14" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">BYOK: you bring your own provider key. Shown once, before Create.</text><rect x="40" y="100" width="1060" height="820" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2"  opacity="1"/><rect x="40" y="100" width="1060" height="42" rx="12" fill="#eef2f6" stroke="#111827" stroke-width="2"  opacity="1"/><circle cx="64" cy="121" r="6" fill="#ef4444" stroke="none" stroke-width="0"/><circle cx="86" cy="121" r="6" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="108" cy="121" r="6" fill="#22c55e" stroke="none" stroke-width="0"/><rect x="160" y="111" width="910" height="20" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1"  opacity="1"/><text x="174" y="125" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="ui-monospace,monospace">dreamstudio.ai</text><rect x="40" y="142" width="1060" height="778" rx="0" fill="#fbfcfd" stroke="#111827" stroke-width="2"  opacity="1"/><rect x="290" y="232" width="560" height="470" rx="14" fill="#fff" stroke="#111827" stroke-width="2"  opacity="1"/><text x="570" y="286" font-size="22" fill="#111827" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Connect a key to create</text><text x="570" y="314" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">You generate on your own key. We never charge or store spend.</text><rect x="330" y="342" width="210" height="30" rx="15" fill="#f7c948" stroke="#cbd5e1" stroke-width="1.5"  opacity="1"/><text x="435" y="361" font-size="12" fill="#111827" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">OpenRouter (recommended)</text><rect x="550" y="342" width="90" height="30" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"  opacity="1"/><text x="595" y="361" font-size="12" fill="#111827" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">NVIDIA</text><rect x="650" y="342" width="90" height="30" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"  opacity="1"/><text x="695" y="361" font-size="12" fill="#111827" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Gemini</text><text x="330" y="414" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">API key</text><rect x="330" y="424" width="480" height="42" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"  opacity="1"/><text x="344" y="450" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="ui-monospace,monospace">sk-or-•••••••••••••••••••••</text><text x="330" y="490" font-size="12.5" fill="#2186eb" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">How to get a free OpenRouter key (30s guide) ↗</text><rect x="330" y="516" width="46" height="24" rx="12" fill="#27ab83" stroke="#111827" stroke-width="1.5"  opacity="1"/><circle cx="364" cy="528" r="9" fill="#fff" stroke="none" stroke-width="0"/><text x="386" y="532" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Use free models only (no spend) — on by default</text><rect x="330" y="562" width="480" height="48" rx="8" fill="#f7c948" stroke="#111827" stroke-width="2"  opacity="1"/><text x="570" y="591" font-size="16" fill="#111827" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Continue →</text><text x="570" y="636" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Just want to read? Browse the public gallery — no key needed.</text><circle cx="540" cy="350" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="540" y="354" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">1</text><circle cx="790" cy="445" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="790" y="449" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">2</text><circle cx="590" cy="490" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="590" y="494" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">3</text><circle cx="353" cy="528" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="353" y="532" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">4</text><circle cx="740" cy="586" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="740" y="590" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">5</text><rect x="1140" y="100" width="300" height="820" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2"  opacity="1"/><text x="1158" y="134" font-size="16" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Notes / interactions</text><line x1="1158" y1="144" x2="1422" y2="144" stroke="#cbd5e1" stroke-width="1" /><circle cx="1168" cy="168" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="1168" y="172" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">1</text><text x="1188" y="168" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Provider tabs — OpenRouter is</text><text x="1188" y="185" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">primary (text + image + references</text><text x="1188" y="202" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">in one place).</text><circle cx="1168" cy="229" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="1168" y="233" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">2</text><text x="1188" y="229" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Paste your key. Stored locally in</text><text x="1188" y="246" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">your browser; sent as a header,</text><text x="1188" y="263" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">never to our DB.</text><circle cx="1168" cy="290" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="1168" y="294" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">3</text><text x="1188" y="290" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Inline guide to grab a key,</text><text x="1188" y="307" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">including OpenRouter’s free models.</text><circle cx="1168" cy="334" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="1168" y="338" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">4</text><text x="1188" y="334" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Free-only mode is ON by default:</text><text x="1188" y="351" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">blocks any paid model so you never</text><text x="1188" y="368" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">spend by accident.</text><circle cx="1168" cy="395" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="1168" y="399" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">5</text><text x="1188" y="395" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Continue gates Create. Reading the</text><text x="1188" y="412" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">gallery needs no key.</text></svg>