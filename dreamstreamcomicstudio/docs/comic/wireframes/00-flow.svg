<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="960" viewBox="0 0 1480 960"><rect x="0" y="0" width="1480" height="960" rx="0" fill="#eef1f4" stroke="none" stroke-width="2"  opacity="1"/><text x="40" y="52" font-size="24" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Comic Studio — page-by-page flow</text><text x="40" y="80" font-size="14" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Quick path (top) lands you in the Reader. Deep path drops into the Editor. One document underneath.</text><rect x="120" y="180" width="200" height="92" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"  opacity="1"/><text x="220" y="218" font-size="16" fill="#111827" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Connect key</text><text x="220" y="242" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">BYOK first-run</text><line x1="326" y1="226" x2="354" y2="226" stroke="#111827" stroke-width="2" /><line x1="354" y1="226" x2="343.8683290659683" y2="230.28360176539516" stroke="#111827" stroke-width="2" /><line x1="354" y1="226" x2="343.8683290659683" y2="221.71639823460484" stroke="#111827" stroke-width="2" /><rect x="360" y="180" width="200" height="92" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"  opacity="1"/><text x="460" y="218" font-size="16" fill="#111827" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Dashboard</text><text x="460" y="242" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">your comics</text><line x1="566" y1="226" x2="594" y2="226" stroke="#111827" stroke-width="2" /><line x1="594" y1="226" x2="583.8683290659683" y2="230.28360176539516" stroke="#111827" stroke-width="2" /><line x1="594" y1="226" x2="583.8683290659683" y2="221.71639823460484" stroke="#111827" stroke-width="2" /><rect x="600" y="180" width="200" height="92" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"  opacity="1"/><text x="700" y="218" font-size="16" fill="#111827" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Create</text><text x="700" y="242" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">idea + style + format</text><line x1="806" y1="226" x2="854" y2="226" stroke="#111827" stroke-width="2" /><line x1="854" y1="226" x2="843.8683290659683" y2="230.28360176539516" stroke="#111827" stroke-width="2" /><line x1="854" y1="226" x2="843.8683290659683" y2="221.71639823460484" stroke="#111827" stroke-width="2" /><rect x="860" y="180" width="200" height="92" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"  opacity="1"/><text x="960" y="218" font-size="16" fill="#111827" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Generating</text><text x="960" y="242" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">story→art→letter</text><line x1="1066" y1="226" x2="1134" y2="226" stroke="#111827" stroke-width="2" /><line x1="1134" y1="226" x2="1123.8683290659683" y2="230.28360176539516" stroke="#111827" stroke-width="2" /><line x1="1134" y1="226" x2="1123.8683290659683" y2="221.71639823460484" stroke="#111827" stroke-width="2" /><rect x="1140" y="180" width="200" height="92" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"  opacity="1"/><text x="1240" y="218" font-size="16" fill="#111827" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Reader</text><text x="1240" y="242" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">finished book</text><text x="120" y="330" font-size="14" fill="#2186eb" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">…or dive deeper to edit any page:</text><line x1="1240" y1="272" x2="1280" y2="420" stroke="#2186eb" stroke-width="2" /><line x1="1280" y1="420" x2="1273.2213232789106" y2="411.33688613078635" stroke="#2186eb" stroke-width="2" /><line x1="1280" y1="420" x2="1281.4917879481582" y2="409.1016254093681" stroke="#2186eb" stroke-width="2" /><rect x="360" y="380" width="220" height="86" rx="10" fill="#eaf2fe" stroke="#2186eb" stroke-width="2"  opacity="1"/><text x="470" y="416" font-size="15" fill="#111827" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Editor shell</text><text x="470" y="440" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">layers · tools</text><line x1="586" y1="423" x2="634" y2="423" stroke="#2186eb" stroke-width="2" /><line x1="634" y1="423" x2="623.8683290659683" y2="427.28360176539513" stroke="#2186eb" stroke-width="2" /><line x1="634" y1="423" x2="623.8683290659683" y2="418.71639823460487" stroke="#2186eb" stroke-width="2" /><rect x="640" y="380" width="220" height="86" rx="10" fill="#eaf2fe" stroke="#2186eb" stroke-width="2"  opacity="1"/><text x="750" y="416" font-size="15" fill="#111827" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Bubbles</text><text x="750" y="440" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">drag/resize/restyle</text><line x1="866" y1="423" x2="914" y2="423" stroke="#2186eb" stroke-width="2" /><line x1="914" y1="423" x2="903.8683290659683" y2="427.28360176539513" stroke="#2186eb" stroke-width="2" /><line x1="914" y1="423" x2="903.8683290659683" y2="418.71639823460487" stroke="#2186eb" stroke-width="2" /><rect x="920" y="380" width="220" height="86" rx="10" fill="#eaf2fe" stroke="#2186eb" stroke-width="2"  opacity="1"/><text x="1030" y="416" font-size="15" fill="#111827" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Region edit</text><text x="1030" y="440" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">circle → re-gen</text><line x1="1146" y1="423" x2="1174" y2="423" stroke="#2186eb" stroke-width="2" /><line x1="1174" y1="423" x2="1163.8683290659683" y2="427.28360176539513" stroke="#2186eb" stroke-width="2" /><line x1="1174" y1="423" x2="1163.8683290659683" y2="418.71639823460487" stroke="#2186eb" stroke-width="2" /><rect x="1180" y="380" width="220" height="86" rx="10" fill="#eaf2fe" stroke="#2186eb" stroke-width="2"  opacity="1"/><text x="1290" y="416" font-size="15" fill="#111827" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Regen + variations</text><text x="1290" y="440" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">seeds</text><line x1="470" y1="466" x2="470" y2="520" stroke="#111827" stroke-width="2" /><line x1="470" y1="520" x2="465.71639823460487" y2="509.8683290659683" stroke="#111827" stroke-width="2" /><line x1="470" y1="520" x2="474.28360176539513" y2="509.8683290659683" stroke="#111827" stroke-width="2" /><rect x="360" y="520" width="220" height="80" rx="10" fill="#eafaf1" stroke="#27ab83" stroke-width="2"  opacity="1"/><text x="470" y="554" font-size="15" fill="#111827" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Export</text><text x="470" y="578" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">PDF · webtoon · CBZ</text><rect x="640" y="520" width="220" height="80" rx="10" fill="#eafaf1" stroke="#27ab83" stroke-width="2"  opacity="1"/><text x="750" y="554" font-size="15" fill="#111827" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Publish / Share</text><text x="750" y="578" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">to gallery</text><rect x="120" y="660" width="1280" height="200" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2"  opacity="1"/><text x="140" y="694" font-size="16" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">How to read these wireframes</text><circle cx="150" cy="728" r="5" fill="#111827" stroke="none" stroke-width="0"/><text x="166" y="732" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Yellow buttons = the primary / AI action on a screen.</text><circle cx="150" cy="754" r="5" fill="#111827" stroke="none" stroke-width="0"/><text x="166" y="758" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Red numbered dots = a specific interaction, explained in each screen’s Notes panel.</text><circle cx="150" cy="780" r="5" fill="#111827" stroke="none" stroke-width="0"/><text x="166" y="784" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Hatched boxes = generated images (panel art, covers, reference sheets).</text><circle cx="150" cy="806" r="5" fill="#111827" stroke="none" stroke-width="0"/><text x="166" y="810" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Blue outline = the deep-edit (Editor) path; green = publish/export.</text><circle cx="150" cy="832" r="5" fill="#111827" stroke="none" stroke-width="0"/><text x="166" y="836" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">One ComicDoc is the source of truth for every screen below — Reader and Editor read the same data.</text></svg>