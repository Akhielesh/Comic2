<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="960" viewBox="0 0 1480 960"><rect x="0" y="0" width="1480" height="960" rx="0" fill="#eef1f4" stroke="none" stroke-width="2"  opacity="1"/><text x="40" y="52" font-size="24" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Stage 6d — Layers (the “layer on layer” system)</text><text x="40" y="80" font-size="14" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Every element is a non-destructive layer. Reorder, hide, lock, blend, group.</text><rect x="40" y="100" width="1060" height="820" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2"  opacity="1"/><rect x="40" y="100" width="1060" height="42" rx="12" fill="#eef2f6" stroke="#111827" stroke-width="2"  opacity="1"/><circle cx="64" cy="121" r="6" fill="#ef4444" stroke="none" stroke-width="0"/><circle cx="86" cy="121" r="6" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="108" cy="121" r="6" fill="#22c55e" stroke="none" stroke-width="0"/><rect x="160" y="111" width="910" height="20" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1"  opacity="1"/><text x="174" y="125" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="ui-monospace,monospace">dreamstudio.ai/edit/aurora-heist</text><rect x="40" y="142" width="1060" height="778" rx="0" fill="#dfe6ee" stroke="#111827" stroke-width="2"  opacity="1"/><rect x="80" y="182" width="560" height="688" rx="6" fill="#fff" stroke="#111827" stroke-width="2"  opacity="1"/><rect x="100" y="202" width="520" height="568" rx="4" fill="#e7ecf1" stroke="#9aa7b4" stroke-width="1.5"  opacity="1"/><line x1="100" y1="202" x2="620" y2="770" stroke="#9aa7b4" stroke-width="1" /><line x1="620" y1="202" x2="100" y2="770" stroke="#9aa7b4" stroke-width="1" /><text x="360" y="490" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">panel art (raster)</text><ellipse cx="300" cy="382" rx="70" ry="48" fill="rgba(39,171,131,0.18)" stroke="#27ab83" stroke-width="2" stroke-dasharray="5 4"/><text x="300" y="382" font-size="11" fill="#27ab83" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">inpaint layer</text><rect x="140" y="242" width="150" height="46" rx="14" fill="#fff" stroke="#111827" stroke-width="2"  opacity="1"/><path d="M 158 286 l 10 18 l 8 -16 z" fill="#fff" stroke="#111827" stroke-width="2"/><text x="215" y="269" font-size="12" fill="#111827" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">One last job, partner.</text><rect x="420" y="302" width="150" height="46" rx="14" fill="#fff" stroke="#111827" stroke-width="2"  opacity="1"/><path d="M 552 346 l 10 18 l 8 -16 z" fill="#fff" stroke="#111827" stroke-width="2"/><text x="495" y="329" font-size="12" fill="#111827" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">Then we vanish.</text><rect x="680" y="182" width="380" height="688" rx="10" fill="#fff" stroke="#111827" stroke-width="2"  opacity="1"/><text x="698" y="212" font-size="14" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">LAYERS — Panel 2</text><rect x="910" y="196" width="130" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"  opacity="1"/><text x="975" y="213" font-size="12" fill="#111827" font-weight="normal" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">＋ add · group ⌘G</text><rect x="696" y="238" width="348" height="54" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"  opacity="1"/><text x="710" y="271" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">☰ T</text><text x="758" y="264" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">SFX “BOOM”</text><text x="758" y="282" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">text</text><text x="910" y="271" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">opacity</text><rect x="960" y="264" width="60" height="8" rx="4" fill="#cbd5e1" stroke="none" stroke-width="2"  opacity="1"/><circle cx="1016" cy="268" r="7" fill="#111827" stroke="none" stroke-width="0"/><text x="910" y="288" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">👁  🔒</text><rect x="696" y="302" width="348" height="54" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"  opacity="1"/><text x="710" y="335" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">☰ B</text><text x="758" y="328" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Bubble “Then we vanish.”</text><text x="758" y="346" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">bubble</text><text x="910" y="335" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">opacity</text><rect x="960" y="328" width="60" height="8" rx="4" fill="#cbd5e1" stroke="none" stroke-width="2"  opacity="1"/><circle cx="1016" cy="332" r="7" fill="#111827" stroke="none" stroke-width="0"/><text x="910" y="352" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">👁  🔒</text><rect x="696" y="366" width="348" height="54" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"  opacity="1"/><text x="710" y="399" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">☰ B</text><text x="758" y="392" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Bubble “One last job…”</text><text x="758" y="410" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">bubble</text><text x="910" y="399" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">opacity</text><rect x="960" y="392" width="60" height="8" rx="4" fill="#cbd5e1" stroke="none" stroke-width="2"  opacity="1"/><circle cx="1016" cy="396" r="7" fill="#111827" stroke="none" stroke-width="0"/><text x="910" y="416" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">👁  🔒</text><rect x="696" y="430" width="348" height="54" rx="8" fill="#eafaf1" stroke="#27ab83" stroke-width="2"  opacity="1"/><text x="710" y="463" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">☰ ✦</text><text x="758" y="456" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Inpaint — hand fix</text><text x="758" y="474" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">inpaint</text><text x="910" y="463" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">opacity</text><rect x="960" y="456" width="60" height="8" rx="4" fill="#cbd5e1" stroke="none" stroke-width="2"  opacity="1"/><circle cx="1016" cy="460" r="7" fill="#111827" stroke="none" stroke-width="0"/><text x="910" y="480" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">👁  🔒</text><rect x="696" y="494" width="348" height="54" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"  opacity="1"/><text x="710" y="527" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">☰ ▣</text><text x="758" y="520" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Panel art</text><text x="758" y="538" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">raster</text><text x="910" y="527" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">opacity</text><rect x="960" y="520" width="60" height="8" rx="4" fill="#cbd5e1" stroke="none" stroke-width="2"  opacity="1"/><circle cx="1016" cy="524" r="7" fill="#111827" stroke="none" stroke-width="0"/><text x="910" y="544" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">👁  🔒</text><rect x="696" y="558" width="348" height="54" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"  opacity="1"/><text x="710" y="591" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">☰ ▦</text><text x="758" y="584" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Page background</text><text x="758" y="602" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">raster</text><text x="910" y="591" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">opacity</text><rect x="960" y="584" width="60" height="8" rx="4" fill="#cbd5e1" stroke="none" stroke-width="2"  opacity="1"/><circle cx="1016" cy="588" r="7" fill="#111827" stroke="none" stroke-width="0"/><text x="910" y="608" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">👁  🔒</text><text x="698" y="850" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">top of list = front.  drag ☰ to reorder.  double-click to rename.</text><circle cx="710" cy="265" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="710" y="269" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">1</text><circle cx="990" cy="332" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="990" y="336" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">2</text><circle cx="300" cy="334" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="300" y="338" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">3</text><circle cx="922" cy="209" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="922" y="213" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">4</text><rect x="1140" y="100" width="300" height="820" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2"  opacity="1"/><text x="1158" y="134" font-size="16" fill="#111827" font-weight="bold" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Notes / interactions</text><line x1="1158" y1="144" x2="1422" y2="144" stroke="#cbd5e1" stroke-width="1" /><circle cx="1168" cy="168" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="1168" y="172" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">1</text><text x="1188" y="168" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Stack order = render order. Bubbles</text><text x="1188" y="185" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">+ SFX sit above art; reorder by</text><text x="1188" y="202" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">dragging the ☰ handle.</text><circle cx="1168" cy="229" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="1168" y="233" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">2</text><text x="1188" y="229" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Per-layer opacity + blend; 👁 hide,</text><text x="1188" y="246" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">🔒 lock. Non-destructive — nothing</text><text x="1188" y="263" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">is flattened until export.</text><circle cx="1168" cy="290" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="1168" y="294" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">3</text><text x="1188" y="290" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">A region edit is just an</text><text x="1188" y="307" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">InpaintLayer composited over the art</text><text x="1188" y="324" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">— lower its opacity or delete to</text><text x="1188" y="341" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">reveal the original.</text><circle cx="1168" cy="368" r="12" fill="#e12d39" stroke="none" stroke-width="0"/><text x="1168" y="372" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">4</text><text x="1188" y="368" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Group related layers (⌘G) — e.g. all</text><text x="1188" y="385" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">of one character’s bubbles — to</text><text x="1188" y="402" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">move/lock together.</text></svg>