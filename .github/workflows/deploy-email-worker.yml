name: Deploy Email Worker

# Keeps the dreamstream-email Cloudflare worker (branded transactional email via
# Cloudflare Email Sending) in sync with email-worker/ source, same pattern as
# deploy-live-worker.yml. The worker bundles the shared templates from
# dreamstreamcomicstudio/shared/email (src/index.ts imports ../../shared/email),
# so template changes must redeploy it too — hence both path filters below.
# Requires repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit),
# CLOUDFLARE_ACCOUNT_ID.
#
# NOTE: wrangler secrets (EMAIL_HMAC_SECRET, SUPABASE_AUTH_HOOK_SECRET) are managed
# in the Cloudflare dashboard / `wrangler secret put` — NOT in this workflow. A
# deploy never touches them; non-secret vars come from email-worker/wrangler.jsonc.

on:
  push:
    branches: [Dreamstrream-v1]
    paths:
      - 'dreamstreamcomicstudio/email-worker/**'
      - 'dreamstreamcomicstudio/shared/email/**'
      # Bundled into the worker (Stream Studio links). tests/config/deployPaths.test.ts enforces
      # that every bundled file is listed here.
      - 'dreamstreamcomicstudio/shared/streamHost.ts'
      - '.github/workflows/deploy-email-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    # Deploy secrets belong to this Environment (ADR 0006 owner action #7).
    environment: production-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # wrangler 4.98+ requires Node >= 22.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # No install scripts in a job that is about to hold the Cloudflare token.
      - name: Install worker dependencies
        working-directory: dreamstreamcomicstudio/email-worker
        run: npm ci --ignore-scripts

      # Pinned, never @latest (same version as the other workers).
      - name: Deploy with wrangler
        working-directory: dreamstreamcomicstudio/email-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.2 deploy
