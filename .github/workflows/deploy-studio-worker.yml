name: Deploy Studio Worker

# Keeps the LIVE Cloudflare worker in sync with studio-worker/ source. The June 2026
# "deploys keep failing" incident was exactly this drift: the repo had the `deploy`
# action but the deployed worker predated it, so every one-click publish got
# `unknown action` (HTTP 400). Auto-deploying on change makes that impossible.
# Requires repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit), CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [Dreamstrream-v1]
    paths:
      - 'dreamstreamcomicstudio/studio-worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker dependencies
        working-directory: dreamstreamcomicstudio/studio-worker
        run: npm ci

      - name: Deploy with wrangler
        working-directory: dreamstreamcomicstudio/studio-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
