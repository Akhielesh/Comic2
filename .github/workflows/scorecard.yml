# OpenSSF Scorecard (ADR 0006 WS-1): a weekly, public score of this repository's supply-chain
# hygiene — pinned actions, token permissions, branch protection, dangerous workflow patterns,
# dependency updates, signed releases. Findings appear under Security → Code scanning.
# Free on public repositories. Read-only except for uploading its own results.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 2' # weekly, Tuesday, off the hour
  push:
    branches: [Dreamstrream-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Upload the SARIF to code scanning.
      security-events: write
      # Publish the results to the public Scorecard API (OIDC, no secret).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
