# The backend already owns provider/database credentials. GitHub authenticates with
# a short-lived OIDC token restricted to this exact production workflow; no copied secrets.
name: Probe NVIDIA Availability

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-maintenance-probe-nvidia
  cancel-in-progress: false

jobs:
  maintain:
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/Dreamstrream-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run authorized backend maintenance
        run: node dreamstreamcomicstudio/scripts/ops/catalogMaintenance.mjs probe-nvidia
