# Comic Studio device matrix (P1-QA; mobile.md §10.2–§10.6) — READ-ONLY, nightly + on demand.
#
# Runs the whole Playwright harness (dreamstreamcomicstudio/tests/e2e) against the QA entry built
# with QA_BUILD=1: 14 device projects (phones, a Fold cover/unfolded/dual-screen, iPads, desktop) +
# the WCAG reflow-320 project + the 4 layout-smoke viewports + the harness self-tests. Specs: studio
# layout per form factor, keyboard-safe composer, Enter rule, Back gesture, balloon touch editing,
# reader per form factor, public reader + shared-link acceptance, axe a11y, PWA, perf (pixel-8).
# The iOS/iPadOS projects emulate the devices on Chromium (CI installs Chromium only); run them on
# WebKit with the `webkit` input. ~25–40 minutes, free on a public repo; the per-PR check is
# layout-smoke.yml.
#
# Screenshot baselines (tests/e2e/__screenshots__/<project>/) are generated HERE only, on Linux, to
# avoid font raster drift: dispatch with `screenshots: true`, download the `e2e-mobile-baselines`
# artifact and commit it. No secrets; the Supabase values are FAKE placeholders (see ci.yml).

name: e2e-mobile

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      projects:
        description: 'Playwright project globs, space-separated (default: everything)'
        required: false
        default: '*'
      webkit:
        description: 'Run the iOS/iPadOS projects on WebKit'
        type: boolean
        default: false
      screenshots:
        description: 'Compare/generate toHaveScreenshot baselines (missing ones are written)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: dreamstreamcomicstudio
    env:
      CI: 'true'
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
      QA_ARTIFACTS: qa-artifacts
      QA_WORKERS: '3'
      QA_WEBKIT: ${{ inputs.webkit && '1' || '' }}
      QA_SCREENSHOTS: ${{ inputs.screenshots && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dreamstreamcomicstudio/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install WebKit
        if: ${{ inputs.webkit }}
        run: npx playwright install --with-deps webkit
      - name: Device matrix
        env:
          PROJECTS: ${{ inputs.projects || '*' }}
        run: |
          args=()
          for p in $PROJECTS; do args+=(--project "$p"); done
          extra=()
          if [ "$QA_SCREENSHOTS" = "1" ]; then extra+=(-- --update-snapshots=missing); fi
          node scripts/layout-smoke.mjs "${args[@]}" "${extra[@]}"
      - name: Upload report and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mobile-report
          path: |
            dreamstreamcomicstudio/qa-artifacts/report
            dreamstreamcomicstudio/qa-artifacts/test-results
            dreamstreamcomicstudio/qa-artifacts/findings.jsonl
            dreamstreamcomicstudio/qa-artifacts/summary.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload screenshot baselines
        if: ${{ always() && inputs.screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mobile-baselines
          path: dreamstreamcomicstudio/tests/e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 14
