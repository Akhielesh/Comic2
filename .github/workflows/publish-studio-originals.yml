name: Publish Studio Originals
on:
  push:
    branches: [Dreamstrream-v1]
    paths:
      - 'dreamstreamcomicstudio/server/assets/originals/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-studio-originals
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/Dreamstrream-v1'
    runs-on: ubuntu-latest
    name: Publish ${{ matrix.book }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        book: [orchard, fox, table-nine, harbor, margin, parrots, glass-hills, night-atlas, hat-shop]
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Publish this edition
        env:
          ORIGINAL_BOOK: ${{ matrix.book }}
        run: node dreamstreamcomicstudio/scripts/ops/publishStudioOriginals.mjs
