name: Cloudflare www redirect

# Keeps www.dreamstreamstudio.ai → dreamstreamstudio.ai a 301 that keeps the path + query
# (dreamstreamcomicstudio/scripts/ops/cloudflare_www_redirect.py — idempotent, touches only
# the www redirect). On demand only: the owner set the rule by hand on 2026-10-22 (verified:
# 301, path + query kept), and the deploy token has no Single Redirect permission, so running it
# on every change only produced red runs. Run it if the rule ever needs restoring.
# Uses CLOUDFLARE_API_TOKEN, which needs Zone → Single Redirect → Edit (plus Zone → Read;
# Page Rules → Edit only if a legacy www forwarding Page Rule exists). If the token lacks
# them the job fails with a message naming the missing permission.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  www-redirect:
    runs-on: ubuntu-latest
    # Uses the Cloudflare token, so it runs in the deploy Environment (ADR 0006 owner action #7).
    environment: production-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Make www keep the full link
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 dreamstreamcomicstudio/scripts/ops/cloudflare_www_redirect.py
