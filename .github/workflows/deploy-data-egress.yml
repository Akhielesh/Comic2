name: Deploy Data Egress Worker

# Allowlisted market-data fetch relay (Yahoo/Stooq/FiscalData) on Cloudflare's
# edge — the backend's datacenter egress IPs are blocked by those upstreams, which
# made every stock/metals/ticker widget return nothing in production. Same
# pattern + secrets as deploy-api-proxy.yml: CLOUDFLARE_API_TOKEN (Workers
# Scripts:Edit + zone Workers Routes:Edit), CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [Dreamstrream-v1]
    paths:
      - 'dreamstreamcomicstudio/data-egress/**'
      - '.github/workflows/deploy-data-egress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    # Deploy secrets belong to this Environment (ADR 0006 owner action #7).
    environment: production-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # wrangler 4.98+ requires Node >= 22.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Pinned, never @latest (same version as the other workers).
      - name: Deploy with wrangler
        working-directory: dreamstreamcomicstudio/data-egress
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.2 deploy

      # The relay fails closed (data-egress/src/index.ts): no EGRESS_SHARED_SECRET on the worker → 503
      # for everything; a request without the right x-egress-key → 403. So the probe checks both:
      # an unkeyed request is refused, and a keyed one (the same value as the worker's secret, stored
      # as the EGRESS_SHARED_SECRET secret of this Environment) reaches Yahoo.
      - name: Verify the relay refuses unkeyed requests and serves keyed ones
        env:
          EGRESS_KEY: ${{ secrets.EGRESS_SHARED_SECRET }}
        run: |
          sleep 10
          probe='https://dreamstreamstudio.ai/egress/fetch?url=https%3A%2F%2Fquery1.finance.yahoo.com%2Fv8%2Ffinance%2Fchart%2FAAPL%3Frange%3D1d%26interval%3D1d'
          unkeyed=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$probe")
          echo "egress probe without a key -> HTTP $unkeyed"
          if [ "$unkeyed" = "503" ]; then
            echo '::error::The relay answers 503 "Relay not configured": EGRESS_SHARED_SECRET is not set on the worker, so every market-data fallback fails. Do owner step O4 (docs/infrastructure/request-surface-hardening.md).'
            exit 1
          elif [ "$unkeyed" != "403" ]; then
            echo "::warning::Expected 403 for a request without x-egress-key, got $unkeyed (a bot challenge to the CI runner looks like this too)."
          fi
          if [ -z "$EGRESS_KEY" ]; then
            echo '::warning::No EGRESS_SHARED_SECRET secret in the production-deploy Environment, so the keyed probe was skipped (the deploy itself succeeded).'
            exit 0
          fi
          body=$(curl -s --max-time 25 -H "x-egress-key: $EGRESS_KEY" "$probe")
          echo "egress AAPL probe with the key -> ${body:0:200}"
          if echo "$body" | grep -q '"chart"'; then
            echo "Relay active — Yahoo JSON received through the edge."
          elif echo "$body" | grep -qi 'challenge-platform\|Just a moment'; then
            echo '::warning::Cloudflare bot challenge served to the CI runner — relay health could not be verified from CI (deploy itself succeeded).'
          elif echo "$body" | grep -q 'Bad or missing x-egress-key'; then
            echo '::error::The worker refused the key: the GitHub secret EGRESS_SHARED_SECRET does not match the worker secret (and so, likely, the backend DATA_EGRESS_SECRET).'
            exit 1
          else
            echo '::warning::Relay did not return Yahoo JSON from CI — check the worker logs (deploy itself succeeded).'
          fi
