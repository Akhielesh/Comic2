name: Deploy Live Worker

# Keeps the dreamstream-live Cloudflare worker (DreamStream Live streaming backend)
# in sync with live-worker/ source (wrangler deploy on push).
# Requires repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit + Workers R2
# Storage:Edit), CLOUDFLARE_ACCOUNT_ID.
#
# PREREQUISITE (one-time, dashboard only): enable R2 on the Cloudflare account.
# Until R2 is enabled, the bucket step and deploy will fail with a clear error;
# re-run this workflow (workflow_dispatch) after enabling.

on:
  push:
    branches: [Dreamstrream-v1]
    paths:
      - 'dreamstreamcomicstudio/live-worker/**'
      # Bundled into the worker (usage metering / fair use). tests/config/deployPaths.test.ts
      # enforces that every bundled file is listed here.
      - 'dreamstreamcomicstudio/shared/stream/usage.ts'
      # The monitor wire/glance contract (ADR 0006 WS-6/7): devices, members, origin and index import it.
      - 'dreamstreamcomicstudio/packages/monitor-core/**'
      - '.github/workflows/deploy-live-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    # Deploy secrets belong to this Environment (ADR 0006 owner action #7: move
    # CLOUDFLARE_API_TOKEN into it and add a required reviewer). Until then the repo
    # secrets still apply — nothing changes for the deploy.
    environment: production-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # wrangler 4.98+ requires Node >= 22.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # No install scripts: nothing a dependency ships gets to run in a job that is
      # about to hold the Cloudflare token.
      - name: Install worker dependencies
        working-directory: dreamstreamcomicstudio/live-worker
        run: npm ci --ignore-scripts

      - name: Ensure R2 bucket exists
        working-directory: dreamstreamcomicstudio/live-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Best-effort convenience: the bucket already exists in this account, and
        # tokens scoped only to Workers Scripts can't create/list buckets. If the
        # bucket is genuinely missing, the deploy step below fails with a clear error.
        continue-on-error: true
        run: npx --yes wrangler@4.151.2 r2 bucket create dreamstream-live

      # wrangler is pinned (never @latest): a release published minutes ago must not be
      # able to ship our Worker. Bump it on purpose, with the other workers.
      - name: Deploy with wrangler
        working-directory: dreamstreamcomicstudio/live-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.2 deploy
