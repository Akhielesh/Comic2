name: Deploy API (Worker + backend container)

# dreamstream-api does two jobs at dreamstreamstudio.ai/api/*:
#   1. the edge front door (agent gate, client-IP forwarding), and
#   2. since October 2026 it RUNS the Express backend as a Cloudflare Container
#      (class Backend, image dreamstreamcomicstudio/Dockerfile.cloudflare),
#      replacing the Railway service. wrangler builds and pushes the image.
# Railway stays dormant for a possible return: set BACKEND_TARGET=origin in
# api-proxy/wrangler.jsonc (see docs/infrastructure/INFRA_MAP.md).
#
# Requires repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, zone Workers
# Routes:Edit, Containers:Edit, D1:Edit) and CLOUDFLARE_ACCOUNT_ID. The backend
# container is why the account stays on Workers Paid.

on:
  push:
    branches: [Dreamstrream-v1]
    paths:
      - 'dreamstreamcomicstudio/api-proxy/**'
      # Bundled into the Worker by api-proxy/src/publicComic.ts (the edge share read path), and
      # productHost also into the container. tests/config/deployPaths.test.ts enforces this list.
      - 'dreamstreamcomicstudio/functions/_shared/**'
      - 'dreamstreamcomicstudio/services/productHost.ts'
      # Everything bundled into the backend image:
      - 'dreamstreamcomicstudio/server/**'
      - 'dreamstreamcomicstudio/shared/**'
      # The shared platform contract (pure TypeScript), imported by the backend's platform tools.
      - 'dreamstreamcomicstudio/packages/platform-core/**'
      - 'dreamstreamcomicstudio/apiTypes.ts'
      - 'dreamstreamcomicstudio/toolCatalog.ts'
      - 'dreamstreamcomicstudio/types.ts'
      - 'dreamstreamcomicstudio/package.json'
      - 'dreamstreamcomicstudio/package-lock.json'
      - 'dreamstreamcomicstudio/Dockerfile.cloudflare'
      - 'dreamstreamcomicstudio/.dockerignore'
      - '.github/workflows/deploy-api-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never run two container rollouts at once; a newer push supersedes a queued one.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  # Bundle the backend exactly as the image does and boot it on the image's Node before
  # anything rolls out: a server that can't start (a dependency that needs a newer Node
  # than the image, an import the runtime stage can't satisfy) stops here instead of
  # crash-looping every container. No secrets, no Environment (server-boot.yml).
  server-boot:
    uses: ./.github/workflows/server-boot.yml

  deploy-worker:
    needs: server-boot
    runs-on: ubuntu-latest
    # Deploy secrets belong to this Environment (ADR 0006 owner action #7).
    environment: production-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # wrangler 4.98+ requires Node >= 22.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # No install scripts in a job that is about to hold the Cloudflare token. (The
      # backend image does its own install inside Dockerfile.cloudflare.)
      - name: Install worker dependencies
        working-directory: dreamstreamcomicstudio/api-proxy
        run: npm ci --ignore-scripts

      - name: Typecheck worker
        working-directory: dreamstreamcomicstudio/api-proxy
        run: npx tsc -p tsconfig.json

      # A retained container DO can carry old runtime envVars across an image rollout. Bake the
      # actual commit into the image through Wrangler's image_vars, then verify that exact commit.
      - name: Prepare versioned backend image configuration
        working-directory: dreamstreamcomicstudio/api-proxy
        run: node scripts/prepareDeploy.mjs

      - name: Deploy with wrangler (builds + pushes the backend image)
        working-directory: dreamstreamcomicstudio/api-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.deploy.json

      # The first request after a deploy cold-starts the container (image pull + boot;
      # a brand-new container application can also take a few minutes to provision),
      # so poll for up to 30 attempts. The workers.dev URL is the definitive check — the
      # custom domain's bot protection challenges GitHub's datacenter IPs.
      - name: Verify the backend container runs the deployed commit
        run: |
          for attempt in $(seq 1 30); do
            health=$(curl --fail -s --max-time 15 https://dreamstream-api.akhieleshsrirangam.workers.dev/api/health || true)
            version=$(curl --fail -s --max-time 15 https://dreamstream-api.akhieleshsrirangam.workers.dev/api/system/version || true)
            if HEALTH_RESPONSE="$health" VERSION_RESPONSE="$version" node -e 'try { const h = JSON.parse(process.env.HEALTH_RESPONSE); const v = JSON.parse(process.env.VERSION_RESPONSE); process.exit(h.status === "ok" && v.gitSha === process.env.GITHUB_SHA ? 0 : 1); } catch { process.exit(1); }'; then
              echo "Backend healthy at expected commit ${GITHUB_SHA}."
              break
            fi
            echo "attempt $attempt: waiting for ${GITHUB_SHA}; version=${version:0:200}; health=${health:0:120}"
            if [ "$attempt" = 30 ]; then
              echo '::error::the backend did not become healthy at the expected commit; rollout is not verified'
              exit 1
            fi
            sleep 10
          done
          body=$(curl -s --max-time 30 https://dreamstreamstudio.ai/api/health || true)
          echo "GET dreamstreamstudio.ai/api/health -> ${body:0:200}"
          if echo "$body" | grep -q '"status"'; then
            echo "Custom-domain route active."
          elif echo "$body" | grep -qi 'challenge-platform\|Just a moment'; then
            echo '::warning::Cloudflare served a bot challenge to the CI runner on the custom domain (the route itself could not be verified from CI). Add a WAF skip rule for /api/health to make this check meaningful.'
          else
            echo '::error::dreamstreamstudio.ai/api/health did not return backend JSON — route not active'
            exit 1
          fi
