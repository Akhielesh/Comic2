name: Deploy API (Worker + backend container)

# dreamstream-api does two jobs at dreamstreamstudio.ai/api/*:
#   1. the edge front door (agent gate, client-IP forwarding), and
#   2. since October 2026 it RUNS the Express backend as a Cloudflare Container
#      (class Backend, image dreamstreamcomicstudio/Dockerfile.cloudflare),
#      replacing the Railway service. wrangler builds and pushes the image.
# Railway stays dormant for a possible return: set BACKEND_TARGET=origin in
# api-proxy/wrangler.jsonc (see docs/infrastructure/INFRA_MAP.md).
#
# Requires repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, zone Workers
# Routes:Edit, Containers:Edit, D1:Edit) and CLOUDFLARE_ACCOUNT_ID. The backend
# container is why the account stays on Workers Paid.

on:
  push:
    branches: [Dreamstrream-v1]
    paths:
      - 'dreamstreamcomicstudio/api-proxy/**'
      # Everything bundled into the backend image:
      - 'dreamstreamcomicstudio/server/**'
      - 'dreamstreamcomicstudio/shared/**'
      - 'dreamstreamcomicstudio/apiTypes.ts'
      - 'dreamstreamcomicstudio/toolCatalog.ts'
      - 'dreamstreamcomicstudio/types.ts'
      - 'dreamstreamcomicstudio/package.json'
      - 'dreamstreamcomicstudio/package-lock.json'
      - 'dreamstreamcomicstudio/Dockerfile.cloudflare'
      - 'dreamstreamcomicstudio/.dockerignore'
      - '.github/workflows/deploy-api-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never run two container rollouts at once; a newer push supersedes a queued one.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    # Deploy secrets belong to this Environment (ADR 0006 owner action #7).
    environment: production-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # wrangler 4.98+ requires Node >= 22.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # No install scripts in a job that is about to hold the Cloudflare token. (The
      # backend image does its own install inside Dockerfile.cloudflare.)
      - name: Install worker dependencies
        working-directory: dreamstreamcomicstudio/api-proxy
        run: npm ci --ignore-scripts

      - name: Typecheck worker
        working-directory: dreamstreamcomicstudio/api-proxy
        run: npx tsc -p tsconfig.json

      # GIT_SHA and BUILD_TIMESTAMP become container environment variables (every Worker variable does),
      # which is what the backend's /api/system build info reads; Railway used to set the equivalents.
      - name: Deploy with wrangler (builds + pushes the backend image)
        working-directory: dreamstreamcomicstudio/api-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var "GIT_SHA:${GITHUB_SHA}" --var "BUILD_TIMESTAMP:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # The first request after a deploy cold-starts the container (image pull + boot;
      # a brand-new container application can also take a few minutes to provision),
      # so poll for up to ~5 minutes. The workers.dev URL is the definitive check — the
      # custom domain's bot protection challenges GitHub's datacenter IPs.
      - name: Verify the backend container answers /api/health
        run: |
          for attempt in $(seq 1 30); do
            body=$(curl -s --max-time 30 https://dreamstream-api.akhieleshsrirangam.workers.dev/api/health || true)
            if echo "$body" | grep -q '"status"'; then
              echo "GET workers.dev /api/health -> ${body:0:200}"
              break
            fi
            echo "attempt $attempt: ${body:0:160}"
            if [ "$attempt" = 30 ]; then
              echo '::error::the backend container did not answer /api/health within ~5 minutes'
              exit 1
            fi
            sleep 10
          done
          body=$(curl -s --max-time 30 https://dreamstreamstudio.ai/api/health || true)
          echo "GET dreamstreamstudio.ai/api/health -> ${body:0:200}"
          if echo "$body" | grep -q '"status"'; then
            echo "Custom-domain route active."
          elif echo "$body" | grep -qi 'challenge-platform\|Just a moment'; then
            echo '::warning::Cloudflare served a bot challenge to the CI runner on the custom domain (the route itself could not be verified from CI). Add a WAF skip rule for /api/health to make this check meaningful.'
          else
            echo '::error::dreamstreamstudio.ai/api/health did not return backend JSON — route not active'
            exit 1
          fi
